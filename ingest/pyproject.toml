[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netnoder-ingest"
version = "0.1.0"
description = "Ingest pcap files into the net-noder aggregated DuckDB store"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1"]

[project.scripts]
netnoder-ingest = "netnoder_ingest.cli:main"
netnoder-names = "netnoder_ingest.names:main"

[tool.setuptools]
packages = ["netnoder_ingest"]

[tool.setuptools.package-data]
netnoder_ingest = ["schema.sql"]
