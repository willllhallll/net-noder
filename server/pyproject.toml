[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netnoder-api"
version = "0.1.0"
description = "Local FastAPI server for the net-noder graph explorer"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "duckdb>=1.1",
    "pydantic>=2",
]

[project.scripts]
netnoder-api = "netnoder_api.main:run"

[tool.setuptools]
packages = ["netnoder_api"]
